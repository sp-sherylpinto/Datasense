version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: data_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: S12@sharu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      args:
        VITE_API_AUTH_TOKEN: dev-token
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:S12%40sharu@postgres:5432/data_analytics
      APP_DB_PASSWORD: analytics_app_rls
      REDIS_URL: redis://redis:6379/0
      API_AUTH_TOKEN: dev-token
      VITE_API_AUTH_TOKEN: dev-token
      DEV_USER_EMAIL: dev@varama.local
  
      AZURE_OPENAI_ENDPOINT: https://api.groq.com/openai/v1
      AZURE_OPENAI_MODEL: llama-3.3-70b-versatile
    depends_on:
      - postgres
      - redis
    volumes:
      - upload_data:/data/uploads
      - result_data:/data/results

  worker:
    build:
      context: .
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:S12%40sharu@postgres:5432/data_analytics
      APP_DB_PASSWORD: analytics_app_rls
      REDIS_URL: redis://redis:6379/0
      API_AUTH_TOKEN: dev-token
      
      AZURE_OPENAI_ENDPOINT: https://api.groq.com/openai/v1
      AZURE_OPENAI_MODEL: llama-3.3-70b-versatile
    depends_on:
      - postgres
      - redis
    volumes:
      - upload_data:/data/uploads
      - result_data:/data/results

volumes:
  postgres_data:
  upload_data:
  result_data: