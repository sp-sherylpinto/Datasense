[tool.poetry]
name = "analytics-service"
version = "0.1.0"
description = "Production-grade data analysis backend service"
authors = ["Admin Automation <tech@varmaandvarma.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.0"
asyncpg = "^0.29.0"
polars = "^1.0.0"
duckdb = "^0.10.0"
pydantic-settings = "^2.2.0"
pyarrow = "^15.0.0"
pdfplumber = "^0.11.0"
scikit-learn = "^1.4.0"
lxml = "^5.1.0"
numpy = "^1.26.0"
openpyxl = "^3.1.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
openai = "^1.30.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
black = "^24.2.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80
target-version = ['py312']

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
